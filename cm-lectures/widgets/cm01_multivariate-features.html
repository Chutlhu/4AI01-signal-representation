<!DOCTYPE html>
<meta charset="utf-8">
<title>OLS on features — cars</title>
<style>
  :root{
    --ink:#1a1a1a;
    --muted:#6b6b6b;
    --rule:#c9c9c9;
    --data:#1f77b4;
    --m1:#d62728;   /* linear      */
    --m2:#ff7f0e;   /* quadratic   */
    --m3:#2ca02c;   /* both        */
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:transparent; color:var(--ink);
    font-family:"EB Garamond","ETBembo",Georgia,"Times New Roman",serif;
    font-size:17px; line-height:1.35;
  }
  #wrap{max-width:820px;margin:0 auto;padding:4px 6px 10px}
  #controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
  button{
    font:inherit;font-size:15px;color:var(--ink);
    background:none;border:1px solid var(--rule);border-radius:3px;
    padding:4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    transition:background-color .15s,border-color .15s;
  }
  button:hover{border-color:var(--muted)}
  button:focus-visible{outline:2px solid var(--data);outline-offset:2px}
  button[aria-pressed="true"]{border-color:currentColor;background:color-mix(in srgb,currentColor 10%,transparent)}
  #m1[aria-pressed="true"]{color:var(--m1)} #m2[aria-pressed="true"]{color:var(--m2)} #m3[aria-pressed="true"]{color:var(--m3)}
  .swatch{width:14px;height:3px;border-radius:2px;background:currentColor;opacity:.45}
  button[aria-pressed="true"] .swatch{opacity:1}
  #xtoggle{margin-left:auto}
  #eqs{min-height:3.6em;font-size:15px;color:var(--muted);margin:2px 2px 0}
  #eqs div{margin:1px 0}
  #eqs b{font-weight:600}
  #eqs .r2{color:var(--muted);font-size:13.5px}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .tick text{font-size:14px;fill:var(--muted)}
  .axlabel{font-size:15px;fill:var(--ink)}
  .frame{fill:none;stroke:var(--rule);stroke-width:1}
  .grid{stroke:var(--rule);stroke-width:.5;stroke-dasharray:2 4}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="wrap">
  <div id="controls">
    <button id="m1" aria-pressed="true"><span class="swatch"></span>linear</button>
    <button id="m2" aria-pressed="false"><span class="swatch"></span>quadratic</button>
    <button id="m3" aria-pressed="false"><span class="swatch"></span>linear + quadratic</button>
    <button id="res" aria-pressed="false">residuals</button>
    <button id="xtoggle" aria-pressed="false">x ↦ speed²</button>
  </div>
  <svg id="plot" viewBox="0 0 780 420" role="img" aria-label="Braking distance against speed, with least-squares fits"></svg>
  <div id="eqs"></div>
</div>

<script>
// ---- R `cars` dataset -------------------------------------------------------
const speed=[4,4,7,7,8,9,10,10,10,11,11,12,12,12,12,13,13,13,13,14,14,14,14,15,15,15,16,16,17,17,17,18,18,18,18,19,19,19,20,20,20,20,20,22,23,24,24,24,24,25];
const dist =[2,10,4,22,16,10,18,26,34,17,28,14,20,24,28,26,34,34,46,26,36,60,80,20,26,54,32,40,32,40,50,42,56,76,84,36,46,68,32,48,52,56,64,66,54,70,92,93,120,85];

// ---- OLS via normal equations ----------------------------------------------
function solve(A,b){                       // small dense Gaussian elimination
  const n=b.length, M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){
    let p=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
    [M[c],M[p]]=[M[p],M[c]];
    for(let r=0;r<n;r++){ if(r===c) continue;
      const f=M[r][c]/M[c][c];
      for(let k=c;k<=n;k++) M[r][k]-=f*M[c][k];
    }
  }
  return M.map((r,i)=>r[n]/r[i]);
}
function ols(design){                      // design: s -> [1, ...features]
  const X=speed.map(design), p=X[0].length;
  const A=Array.from({length:p},(_,i)=>Array.from({length:p},(_,j)=>
          X.reduce((a,x)=>a+x[i]*x[j],0)));
  const b=Array.from({length:p},(_,i)=>X.reduce((a,x,k)=>a+x[i]*dist[k],0));
  const th=solve(A,b);
  const f =s=>design(s).reduce((a,v,i)=>a+v*th[i],0);
  const ybar=dist.reduce((a,v)=>a+v,0)/dist.length;
  const rss=dist.reduce((a,y,k)=>a+(y-f(speed[k]))**2,0);
  const tss=dist.reduce((a,y)=>a+(y-ybar)**2,0);
  return {th,f,rss,r2:1-rss/tss};
}
const models={
  m1:{...ols(s=>[1,s]),   color:'var(--m1)', name:'linear',
      eq:t=>`dist = ${f(t[0])} ${sg(t[1])} speed`},
  m2:{...ols(s=>[1,s*s]), color:'var(--m2)', name:'quadratic',
      eq:t=>`dist = ${f(t[0])} ${sg(t[1])} speed²`},
  m3:{...ols(s=>[1,s,s*s]),color:'var(--m3)',name:'linear + quadratic',
      eq:t=>`dist = ${f(t[0])} ${sg(t[1])} speed ${sg(t[2])} speed²`}
};
function f(v){ return (Math.abs(v)<1?v.toPrecision(3):v.toFixed(2)).replace('-','−'); }
function sg(v){ return (v<0?'− ':'+ ')+f(Math.abs(v)); }

// ---- geometry ---------------------------------------------------------------
const W=780,H=420,M={l:70,r:24,t:26,b:52};
const pw=W-M.l-M.r, ph=H-M.t-M.b;
const XMAX=[30,625], YMIN=-20, YMAX=140;
const py=y=>M.t+ph*(1-(y-YMIN)/(YMAX-YMIN));
const px=(s,t)=>{                          // morphing horizontal coordinate
  const a=M.l+pw*s/XMAX[0], b=M.l+pw*s*s/XMAX[1];
  return a+(b-a)*t;
};
const TICKS=[0,5,10,15,20,25,30];
const YTICKS=[0,50,100];

// ---- state ------------------------------------------------------------------
const on={m1:true,m2:false,m3:false};
let showRes=false, target=0, t=0, anim=null;
const svg=document.getElementById('plot');
const NS='http://www.w3.org/2000/svg';
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};

function draw(){
  svg.textContent='';
  const g=el('g');

  // frame + gridlines
  for(const y of YTICKS){
    g.append(el('line',{class:'grid',x1:M.l,x2:M.l+pw,y1:py(y),y2:py(y)}));
  }
  g.append(el('rect',{class:'frame',x:M.l,y:M.t,width:pw,height:ph}));

  // x ticks: anchored to speed values, positions and labels morph together
  for(const v of TICKS){
    const x=px(v,t);
    const edge=Math.min(1,Math.max(0,1-(x-(M.l+pw))/18));   // fade out past the frame
    if(edge<=0) continue;
    const tk=el('g',{class:'tick',opacity:edge});
    tk.append(el('line',{x1:x,x2:x,y1:M.t+ph,y2:M.t+ph+6,stroke:'var(--rule)'}));
    const lab=(o,txt)=>{const e=el('text',{x:x,y:M.t+ph+24,'text-anchor':'middle',opacity:o});e.textContent=txt;return e;};
    tk.append(lab(1-t,v));
    tk.append(lab(t,v*v));
    g.append(tk);
  }
  for(const v of YTICKS){
    const tk=el('g',{class:'tick'});
    tk.append(el('line',{x1:M.l-6,x2:M.l,y1:py(v),y2:py(v),stroke:'var(--rule)'}));
    const e=el('text',{x:M.l-11,y:py(v)+5,'text-anchor':'end'});e.textContent=v;tk.append(e);
    g.append(tk);
  }

  // axis labels
  const xl=el('text',{class:'axlabel',x:M.l+pw/2,y:H-8,'text-anchor':'middle'});
  xl.textContent = t<.5 ? 'Speed [mph]' : 'Speed² [(mph)²]';
  xl.setAttribute('opacity', Math.abs(t-.5)*2*0.85+0.15);
  g.append(xl);
  const yl=el('text',{class:'axlabel',x:-(M.t+ph/2),y:18,transform:'rotate(-90)','text-anchor':'middle'});
  yl.textContent='Distance [ft]'; g.append(yl);

  // residuals
  if(showRes) for(const k in models){ if(!on[k]) continue;
    for(let i=0;i<speed.length;i++){
      g.append(el('line',{x1:px(speed[i],t),x2:px(speed[i],t),
        y1:py(dist[i]),y2:py(models[k].f(speed[i])),
        stroke:models[k].color,'stroke-width':1,opacity:.35}));
    }
  }

  // data
  for(let i=0;i<speed.length;i++)
    g.append(el('circle',{cx:px(speed[i],t),cy:py(dist[i]),r:4.2,fill:'var(--data)',opacity:.85}));

  // fitted curves
  for(const k in models){ if(!on[k]) continue;
    let d='';
    for(let i=0;i<=240;i++){
      const s=4+(25-4)*i/240;
      d+=(i?'L':'M')+px(s,t).toFixed(2)+' '+py(models[k].f(s)).toFixed(2)+' ';
    }
    g.append(el('path',{d,fill:'none',stroke:models[k].color,'stroke-width':2.4,
                        'stroke-linecap':'round'}));
  }
  svg.append(g);
}

function equations(){
  const box=document.getElementById('eqs'); box.textContent='';
  for(const k in models){ if(!on[k]) continue;
    const m=models[k], d=document.createElement('div');
    d.style.color=m.color;
    d.innerHTML=`<b>${m.eq(m.th)}</b> <span class="r2">R² = ${m.r2.toFixed(3)}, RSS = ${m.rss.toFixed(0)}</span>`;
    box.append(d);
  }
}

function animate(){
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce){ t=target; draw(); return; }
  cancelAnimationFrame(anim);
  const t0=performance.now(), from=t, span=target-from, dur=750;
  (function step(now){
    const u=Math.min(1,(now-t0)/dur);
    t=from+span*(u<.5?4*u**3:1-(-2*u+2)**3/2);
    draw();
    if(u<1) anim=requestAnimationFrame(step);
  })(t0);
}

// ---- wiring -----------------------------------------------------------------
for(const k of ['m1','m2','m3']){
  document.getElementById(k).onclick=()=>{
    on[k]=!on[k];
    document.getElementById(k).setAttribute('aria-pressed',on[k]);
    draw(); equations();
  };
}
document.getElementById('res').onclick=e=>{
  showRes=!showRes; e.currentTarget.setAttribute('aria-pressed',showRes); draw();
};
document.getElementById('xtoggle').onclick=e=>{
  target=target?0:1;
  e.currentTarget.setAttribute('aria-pressed',!!target);
  e.currentTarget.textContent = target ? 'x ↦ speed' : 'x ↦ speed²';
  animate();
};
addEventListener('keydown',e=>{
  const map={'1':'m1','2':'m2','3':'m3'};
  if(map[e.key]) document.getElementById(map[e.key]).click();
  if(e.key==='x'||e.key==='X') document.getElementById('xtoggle').click();
  if(e.key==='r'||e.key==='R') document.getElementById('res').click();
});

draw(); equations();
</script>
