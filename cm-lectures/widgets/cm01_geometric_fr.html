<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Geometric interpretation of the frequency response</title>
<style>
  :root{
    --ink:#1c1c1a; --ink2:#5f5e5a; --ink3:#8a8983;
    --line:#dedcd4; --surf:#f6f5f1; --page:#ffffff;
    --teal:#1d9e75; --coral:#d85a30; --violet:#6250d6; --blue:#2a78d6;
    --col1:1fr; --col2:1.35fr;
  }
  html.dark, html[data-theme="dark"]{
    --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8a8983;
    --line:#3a3a37; --surf:#232321; --page:transparent;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;padding:4px 8px;background:var(--page);color:var(--ink);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;}
  .wrap{max-width:900px;margin:0 auto;}
  .top{display:grid;grid-template-columns:minmax(0,var(--col1)) minmax(0,var(--col2));
       gap:16px;align-items:start;}
  svg{display:block;color:var(--ink2);width:100%;}
  #zplane{touch-action:none;cursor:grab;}
  #zplane.grabbing{cursor:grabbing;}
  .plab{font-size:12px;color:var(--ink2);margin:0 0 2px;}
  #ctrls{display:grid;grid-template-columns:20px minmax(0,1fr) 52px;gap:4px 6px;align-items:center;margin-top:6px;}
  label{font-size:12px;color:var(--ink2);}
  input[type=range]{width:100%;accent-color:var(--teal);}
  .val{font-size:11px;font-family:ui-monospace,monospace;color:var(--ink2);text-align:right;}
  .row{display:flex;gap:6px;align-items:center;margin-top:6px;}
  button{font-size:11px;font-family:ui-monospace,monospace;padding:5px 10px;border-radius:6px;
       cursor:pointer;background:transparent;color:var(--ink);border:1px solid var(--line);}
  button.on{border:2px solid var(--teal);background:var(--surf);}
  #hint{font-size:11px;color:var(--ink3);margin-top:5px;}
  #note{font-size:12px;color:var(--ink2);margin-top:8px;min-height:16px;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){ #play{display:none;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <svg id="zplane" viewBox="0 0 300 300" role="img"
           aria-label="Z-plane with unit circle, the draggable conjugate pole pair P and Q, the point M on the unit circle, and the segments PM and QM"></svg>
      <div id="ctrls"></div>
      <div class="row">
        <button id="play">move M</button>
        <button id="db">dB scale</button>
      </div>
      <div id="hint">drag P or Q to place the pole, drag M around the circle</div>
    </div>

    <div>
      <div class="plab">|H|</div>
      <svg id="frplot" viewBox="0 0 420 240" role="img"
           aria-label="Magnitude of the frequency response against normalised frequency"></svg>
      <div id="note"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var TEAL='#1d9e75', CORAL='#d85a30', VIOLET='#6250d6', BLUE='#2a78d6';
  var RMAX=0.995;
  var q=new URLSearchParams(location.search);
  if(q.get('theme')==='dark') document.documentElement.classList.add('dark');
  if(q.has('cols')){
    var cols=q.get('cols').split(',').map(parseFloat);
    if(cols.length===2 && cols.every(function(v){return isFinite(v)&&v>0;})){
      document.documentElement.style.setProperty('--col1',cols[0]+'fr');
      document.documentElement.style.setProperty('--col2',cols[1]+'fr');
    }
  }

  // pole state, dragged with the mouse
  var rho=0.81, th=45*Math.PI/180;
  if(q.has('rho')){   var a=parseFloat(q.get('rho'));   if(isFinite(a)) rho=Math.max(0,Math.min(RMAX,a)); }
  if(q.has('theta')){ var b=parseFloat(q.get('theta')); if(isFinite(b)) th=Math.max(0,Math.min(180,b))*Math.PI/180; }

  // M stays on a slider so it can also be swept automatically
  var wSpec={min:0,max:180,step:0.5,val:15};
  if(q.has('w')){ var c=parseFloat(q.get('w')); if(isFinite(c)) wSpec.val=Math.max(0,Math.min(180,c)); }
  var cw=document.getElementById('ctrls');
  var lb=document.createElement('label'); lb.textContent='\u03c9'; lb.htmlFor='w';
  var rg=document.createElement('input'); rg.type='range'; rg.id='w';
  rg.min=wSpec.min; rg.max=wSpec.max; rg.step=wSpec.step; rg.value=wSpec.val;
  rg.setAttribute('aria-label','position of M on the unit circle');
  var vv=document.createElement('span'); vv.className='val'; vv.id='wv';
  rg.addEventListener('input',draw);
  [lb,rg,vv].forEach(function(e){cw.appendChild(e);});

  var playing=false, dbMode=false, raf=null;
  var playBtn=document.getElementById('play'), dbBtn=document.getElementById('db');
  playBtn.addEventListener('click',function(){
    playing=!playing; playBtn.className=playing?'on':'';
    if(playing) tick(); else if(raf) cancelAnimationFrame(raf);
  });
  dbBtn.addEventListener('click',function(){
    dbMode=!dbMode; dbBtn.className=dbMode?'on':''; draw();
  });
  function tick(){
    var v=parseFloat(rg.value)+0.6;
    rg.value=(v>180)?0:v;
    draw();
    if(playing) raf=requestAnimationFrame(tick);
  }

  /* ---------- dragging in the z-plane ---------- */
  var CX=150, CY=150, K=110;
  var svg=document.getElementById('zplane'), grab=null;

  function toPlane(ev){
    var r=svg.getBoundingClientRect();
    var sx=(ev.clientX-r.left)/r.width*300, sy=(ev.clientY-r.top)/r.height*300;
    return {sx:sx, sy:sy, re:(sx-CX)/K, im:(CY-sy)/K};
  }
  function handles(){
    var wd=parseFloat(rg.value)*Math.PI/180;
    return {
      P:{x:CX+rho*Math.cos(th)*K, y:CY-rho*Math.sin(th)*K},
      Q:{x:CX+rho*Math.cos(th)*K, y:CY+rho*Math.sin(th)*K},
      M:{x:CX+Math.cos(wd)*K,     y:CY-Math.sin(wd)*K}
    };
  }
  svg.addEventListener('pointerdown',function(ev){
    var p=toPlane(ev), h=handles(), best=null, bd=26;
    ['P','Q','M'].forEach(function(key){
      var d=Math.hypot(p.sx-h[key].x, p.sy-h[key].y);
      if(d<bd){ bd=d; best=key; }
    });
    if(!best) return;
    grab=(best==='M')?'M':'P';
    svg.setPointerCapture(ev.pointerId);
    svg.classList.add('grabbing');
    move(p);
    ev.preventDefault();
  });
  svg.addEventListener('pointermove',function(ev){
    if(!grab) return;
    move(toPlane(ev));
    ev.preventDefault();
  });
  ['pointerup','pointercancel'].forEach(function(t){
    svg.addEventListener(t,function(){ grab=null; svg.classList.remove('grabbing'); });
  });
  function move(p){
    var ang=Math.atan2(Math.abs(p.im), p.re);   // fold onto the upper half, P and Q stay conjugate
    if(grab==='M'){
      rg.value=(ang*180/Math.PI).toFixed(1);
    } else {
      rho=Math.max(0,Math.min(RMAX,Math.hypot(p.re,p.im)));
      th=ang;
    }
    draw();
  }

  // |H| = 1 / (|e^{jw} - p| |e^{jw} - p*|), p = rho e^{j theta}
  function dists(rr,tt,w){
    var mx=Math.cos(w), my=Math.sin(w);
    var px=rr*Math.cos(tt), py=rr*Math.sin(tt);
    var PM=Math.hypot(mx-px,my-py), QM=Math.hypot(mx-px,my+py);
    return {PM:PM, QM:QM, H:1/Math.max(PM*QM,1e-12), px:px, py:py, mx:mx, my:my};
  }

  function draw(){
    var wd=parseFloat(rg.value), w=wd*Math.PI/180, thd=th*180/Math.PI;
    document.getElementById('wv').textContent=(wd/360).toFixed(3);
    var d=dists(rho,th,w);

    /* ---------- z-plane ---------- */
    function X(re){ return CX+re*K; }
    function Y(im){ return CY-im*K; }
    var g='';
    g+='<line x1="20" y1="'+CY+'" x2="280" y2="'+CY+'" stroke="currentColor" stroke-width="1" opacity="0.35"/>';
    g+='<line x1="'+CX+'" y1="20" x2="'+CX+'" y2="280" stroke="currentColor" stroke-width="1" opacity="0.35"/>';
    g+='<circle cx="'+CX+'" cy="'+CY+'" r="'+K+'" fill="none" stroke="'+VIOLET+'" stroke-width="1.8"/>';

    var Px=X(d.px), Py=Y(d.py), Qx=X(d.px), Qy=Y(-d.py), Mx=X(d.mx), My=Y(d.my);
    g+='<line x1="'+Px.toFixed(1)+'" y1="'+Py.toFixed(1)+'" x2="'+Mx.toFixed(1)+'" y2="'+My.toFixed(1)+'" stroke="'+TEAL+'" stroke-width="1.8"/>';
    g+='<line x1="'+Qx.toFixed(1)+'" y1="'+Qy.toFixed(1)+'" x2="'+Mx.toFixed(1)+'" y2="'+My.toFixed(1)+'" stroke="'+TEAL+'" stroke-width="1.8" opacity="0.6"/>';
    g+='<text x="'+((Px+Mx)/2+5).toFixed(1)+'" y="'+((Py+My)/2-4).toFixed(1)+'" font-size="11" fill="'+TEAL+'">PM</text>';
    g+='<text x="'+((Qx+Mx)/2+5).toFixed(1)+'" y="'+((Qy+My)/2+10).toFixed(1)+'" font-size="11" fill="'+TEAL+'">QM</text>';

    [[Px,Py,'P'],[Qx,Qy,'Q']].forEach(function(a){
      g+='<circle cx="'+a[0].toFixed(1)+'" cy="'+a[1].toFixed(1)+'" r="13" fill="'+CORAL+'" opacity="'+(grab==='P'?0.16:0.07)+'"/>';
      g+='<line x1="'+(a[0]-5)+'" y1="'+(a[1]-5)+'" x2="'+(a[0]+5)+'" y2="'+(a[1]+5)+'" stroke="'+CORAL+'" stroke-width="2.2"/>';
      g+='<line x1="'+(a[0]-5)+'" y1="'+(a[1]+5)+'" x2="'+(a[0]+5)+'" y2="'+(a[1]-5)+'" stroke="'+CORAL+'" stroke-width="2.2"/>';
      g+='<text x="'+(a[0]+9)+'" y="'+(a[1]-9)+'" font-size="12" fill="'+CORAL+'">'+a[2]+'</text>';
    });
    g+='<circle cx="'+Mx.toFixed(1)+'" cy="'+My.toFixed(1)+'" r="13" fill="'+BLUE+'" opacity="'+(grab==='M'?0.16:0.07)+'"/>';
    g+='<circle cx="'+Mx.toFixed(1)+'" cy="'+My.toFixed(1)+'" r="4.5" fill="'+BLUE+'"/>';
    g+='<text x="'+(Mx+9).toFixed(1)+'" y="'+(My-9).toFixed(1)+'" font-size="12" fill="'+BLUE+'">M</text>';
    g+='<text x="'+(CX-11)+'" y="'+(CY+13)+'" font-size="11" fill="currentColor">O</text>';
    g+='<text x="'+(CX+K-30)+'" y="'+(CY-8)+'" font-size="11" fill="'+VIOLET+'">|z|=1</text>';
    g+='<text x="10" y="18" font-size="11" font-family="ui-monospace,monospace" fill="'+CORAL+'">\u03c1 = '+rho.toFixed(3)+'</text>';
    g+='<text x="10" y="32" font-size="11" font-family="ui-monospace,monospace" fill="'+CORAL+'">\u03b8 = '+thd.toFixed(1)+'\u00b0</text>';
    svg.innerHTML=g;

    /* ---------- frequency response ---------- */
    var W=420, H=240, L=44, Rp=10, T=12, Bm=26;
    var NP=420, xs=[], ys=[], i, ww, hv, m=0;
    for(i=0;i<=NP;i++){
      ww=Math.PI*i/NP;
      hv=dists(rho,th,ww).H;
      if(dbMode) hv=20*Math.log10(Math.max(hv,1e-9));
      xs.push(i/NP); ys.push(hv);
      if(hv>m) m=hv;
    }
    var lo, hi;
    if(dbMode){ hi=Math.ceil((m+3)/10)*10; lo=hi-70; }
    else { hi=m*1.1; lo=0; if(hi<1e-6) hi=1; }
    var pw=W-L-Rp, ph=H-T-Bm;
    function FX(f){ return L+f*pw; }
    function FY(v){ return T+ph*(1-(v-lo)/(hi-lo)); }

    var s='';
    s+='<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-Rp)+'" y2="'+(T+ph)+'" stroke="currentColor" stroke-width="1" opacity="0.45"/>';
    s+='<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(T+ph)+'" stroke="currentColor" stroke-width="1" opacity="0.45"/>';
    for(var t=0;t<=5;t++){
      var fx=FX(t/5);
      s+='<line x1="'+fx.toFixed(1)+'" y1="'+(T+ph)+'" x2="'+fx.toFixed(1)+'" y2="'+(T+ph+4)+'" stroke="currentColor" stroke-width="1" opacity="0.45"/>';
      s+='<text x="'+fx.toFixed(1)+'" y="'+(H-11)+'" font-size="10" text-anchor="middle" fill="currentColor">'+(t/10).toFixed(1)+'</text>';
    }
    for(var u=0;u<=4;u++){
      var vq=lo+(hi-lo)*u/4, gy=FY(vq);
      s+='<line x1="'+L+'" y1="'+gy.toFixed(1)+'" x2="'+(W-Rp)+'" y2="'+gy.toFixed(1)+'" stroke="currentColor" stroke-width="1" opacity="0.12"/>';
      s+='<text x="'+(L-5)+'" y="'+(gy+3.5).toFixed(1)+'" font-size="10" text-anchor="end" fill="currentColor">'+(Math.abs(vq)>=100?vq.toFixed(0):vq.toFixed(1))+'</text>';
    }
    s+='<text x="'+(L+pw/2)+'" y="'+(H-1)+'" font-size="10" text-anchor="middle" fill="currentColor">normalised frequency  \u03c9/2\u03c0</text>';

    var pth='';
    for(i=0;i<=NP;i++){
      var yy=Math.max(lo,Math.min(hi,ys[i]));
      pth+=(i===0?'M ':'L ')+FX(xs[i]).toFixed(1)+' '+FY(yy).toFixed(1)+' ';
    }
    s+='<path d="'+pth+'" fill="none" stroke="'+TEAL+'" stroke-width="2"/>';

    var hcur=dbMode?20*Math.log10(Math.max(d.H,1e-9)):d.H;
    var cxp=FX(wd/180), cyp=FY(Math.max(lo,Math.min(hi,hcur)));
    s+='<line x1="'+cxp.toFixed(1)+'" y1="'+T+'" x2="'+cxp.toFixed(1)+'" y2="'+(T+ph)+'" stroke="'+BLUE+'" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/>';
    s+='<circle cx="'+cxp.toFixed(1)+'" cy="'+cyp.toFixed(1)+'" r="4" fill="'+BLUE+'"/>';
    document.getElementById('frplot').innerHTML=s;

    /* ---------- note ---------- */
    var cosr=(1+rho*rho)/(2*rho)*Math.cos(th), note;
    if(rho<0.02) note='Poles at the origin: both distances stay at 1, the response is flat.';
    else if(thd<1) note='Pole on the positive real axis: M is closest to it at \u03c9=0, giving a low-pass shape.';
    else if(thd>179) note='Pole on the negative real axis: the peak sits at \u03c9=\u03c0, giving a high-pass shape.';
    else if(Math.abs(cosr)>1) note='The pole is too far inside: no interior peak, the maximum falls on an edge of the band.';
    else note='Resonance near \u03c9/2\u03c0 = '+(Math.acos(cosr)/(2*Math.PI)).toFixed(3)+
              '. Push P towards the circle and PM collapses: the peak sharpens.';
    document.getElementById('note').textContent=note;
  }

  draw();
  window.addEventListener('resize',draw);
})();
</script></body></html>
