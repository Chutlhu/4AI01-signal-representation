<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rejector filter — acoustic feedback</title>
<style>
  :root{
    --ink:#12161c;
    --paper:#ffffff;
    --field:#fbfaf7;
    --rule:#1c2128;
    --faint:#8a8f98;
    --sig-in:#b9bec7;
    --sig-out:#1f5fbf;
    --notch:#c0392b;
    --live:#137a4c;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:14px 16px 16px;
    background:var(--paper);color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-size:15px;line-height:1.35;
  }
  .num{font-family:"SF Mono",ui-monospace,"DejaVu Sans Mono",Menlo,monospace;font-variant-numeric:tabular-nums}

  .bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px;margin-bottom:12px}
  .group{display:flex;flex-direction:column;gap:4px}
  .group>span{font-size:12.5px;color:var(--faint);letter-spacing:.01em}
  button{
    font:inherit;font-size:14px;padding:5px 12px;cursor:pointer;
    background:var(--paper);color:var(--ink);
    border:1px solid var(--rule);border-radius:2px;
  }
  button:hover{background:#f1efe9}
  button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--sig-out);outline-offset:2px}
  .seg{display:flex}
  .seg button{border-radius:0;margin-left:-1px}
  .seg button:first-child{border-radius:2px 0 0 2px;margin-left:0}
  .seg button:last-child{border-radius:0 2px 2px 0}
  #play{min-width:88px}
  #bypass[aria-pressed="true"]{background:var(--notch);border-color:var(--notch);color:#fff}

  .slider{display:flex;flex-direction:column;gap:2px;min-width:210px}
  .slider label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;color:var(--faint)}
  .slider label b{font-weight:400;color:var(--ink);font-size:14px}
  input[type=range]{width:100%;accent-color:var(--notch);margin:0}

  .plots{display:grid;grid-template-columns:1fr 250px;gap:14px;align-items:start}
  .small{display:grid;grid-template-rows:auto auto;gap:12px}
  figure{margin:0}
  figcaption{font-size:12.5px;color:var(--faint);margin-bottom:3px}
  canvas{display:block;width:100%;background:var(--field);border:1px solid var(--rule)}

  .readout{margin-top:10px;font-size:13px;color:var(--faint);display:flex;flex-wrap:wrap;gap:22px}
  .readout b{font-weight:400;color:var(--ink)}
  #hint{margin-top:8px;font-size:13px;color:var(--faint);min-height:1.3em}
  @media (max-width:820px){.plots{grid-template-columns:1fr}.small{grid-template-columns:1fr 1fr;grid-template-rows:auto}}
</style>
</head>
<body>

<div class="bar">
  <div class="group">
    <span>Signal</span>
    <div class="seg" role="group">
      <button id="src-howl" aria-pressed="true">Speech + feedback</button>
      <button id="src-clean" aria-pressed="false">Speech only</button>
      <button id="src-mic" aria-pressed="false">Microphone</button>
    </div>
  </div>
  <div class="group">
    <span>Playback</span>
    <button id="play">Play</button>
  </div>
</div>
<div class="bar">
  <div class="group">
    <span>Filter</span>
    <button id="bypass" aria-pressed="false">Filter on</button>
  </div>
  <div class="slider">
    <label for="nu">notch frequency &nu;<sub>c</sub> <b><span class="num" id="nu-v">0.068</span> &nbsp;(<span class="num" id="hz-v">1094</span> Hz)</b></label>
    <input type="range" id="nu" min="0.005" max="0.495" step="0.0005" value="0.0684">
  </div>
  <div class="slider" style="min-width:170px">
    <label for="rho">pole radius &rho; <b class="num" id="rho-v">0.990</b></label>
    <input type="range" id="rho" min="0.5" max="0.9995" step="0.0005" value="0.99">
  </div>
  <div class="group">
    <span>&nbsp;</span>
    <button id="snap">Snap to loudest peak</button>
  </div>
</div>

<div class="plots">
  <figure>
    <figcaption>Spectrum before (grey) and after (blue) the filter, with |H(e<sup>2i&pi;&nu;</sup>)| in red</figcaption>
    <canvas id="spec" width="1000" height="330"></canvas>
  </figure>
  <div class="small">
    <figure>
      <figcaption>Impulse response h(n)</figcaption>
      <canvas id="ir" width="500" height="150"></canvas>
    </figure>
    <figure>
      <figcaption>Poles &times; and zeros &compfn; in the z-plane</figcaption>
      <canvas id="zp" width="500" height="150"></canvas>
    </figure>
  </div>
</div>

<div class="readout">
  <span>notch width &Delta;&nu; &asymp; <b class="num" id="bw">0.003</b></span>
  <span>IR decay time &asymp; <b class="num" id="tau">100</b> samples (<b class="num" id="taums">6</b> ms)</span>
  <span>sampling rate <b class="num" id="fs">16000</b> Hz</span>
</div>
<div id="hint"></div>

const $ = id => document.getElementById(id);
const hint = m => $("hint").textContent = m;

let ctx = null, srcNode = null, micStream = null, proc = null;
let anaIn = null, anaOut = null, bufHowl = null, bufClean = null;
let playing = false, source = "howl", bypass = false;
let nu = 0.0684, rho = 0.99;
// smoothed coefficients (avoid clicks while dragging)
let cS = Math.cos(2*Math.PI*nu), rS = rho;
let x1=0,x2=0,y1=0,y2=0;

function b64ToBuf(b64){
  const bin = atob(b64), a = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return a.buffer;
}

async function ensureCtx(){
  if(ctx) { if(ctx.state==="suspended") await ctx.resume(); return; }
  ctx = new (window.AudioContext||window.webkitAudioContext)();
  $("fs").textContent = Math.round(ctx.sampleRate);
  anaIn = ctx.createAnalyser();  anaIn.fftSize = 4096;  anaIn.smoothingTimeConstant = 0.75;
  anaOut = ctx.createAnalyser(); anaOut.fftSize = 4096; anaOut.smoothingTimeConstant = 0.75;
  proc = ctx.createScriptProcessor(1024, 1, 1);
  proc.onaudioprocess = e => {
    const xin = e.inputBuffer.getChannelData(0);
    const yout = e.outputBuffer.getChannelData(0);
    if(bypass){ yout.set(xin); x1=x2=y1=y2=0; return; }
    const cT = Math.cos(2*Math.PI*nu), rT = rho, a = 0.002;
    for(let n=0;n<xin.length;n++){
      cS += a*(cT-cS); rS += a*(rT-rS);
      const x = xin[n];
      const y = x - 2*cS*x1 + x2 + 2*rS*cS*y1 - rS*rS*y2;
      x2=x1; x1=x; y2=y1; y1=y;
      yout[n] = y;
    }
  };
  proc.connect(anaOut); anaOut.connect(ctx.destination);
  bufHowl  = await ctx.decodeAudioData(b64ToBuf(AUDIO_HOWL));
  bufClean = await ctx.decodeAudioData(b64ToBuf(AUDIO_CLEAN));
}

function stop(){
  if(srcNode){ try{srcNode.stop();}catch(e){} srcNode.disconnect(); srcNode=null; }
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
  playing = false; $("play").textContent = "Play";
}

async function start(){
  await ensureCtx();
  stop();
  if(source==="mic"){
    try{
      micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    }catch(e){ hint("Microphone blocked by the browser. Allow access, or pick a recorded signal."); return; }
    srcNode = ctx.createMediaStreamSource(micStream);
    hint("Wear headphones: with speakers you will create real feedback in the room.");
  } else {
    srcNode = ctx.createBufferSource();
    srcNode.buffer = (source==="howl") ? bufHowl : bufClean;
    srcNode.loop = true;
    srcNode.start();
    hint("");
  }
  srcNode.connect(anaIn); srcNode.connect(proc);
  playing = true; $("play").textContent = "Stop";
}

$("play").onclick = () => playing ? stop() : start();
["howl","clean","mic"].forEach(s => $("src-"+s).onclick = async () => {
  source = s;
  ["howl","clean","mic"].forEach(t => $("src-"+t).setAttribute("aria-pressed", String(t===s)));
  if(playing) await start();
});
$("bypass").onclick = () => {
  bypass = !bypass;
  $("bypass").setAttribute("aria-pressed", String(bypass));
  $("bypass").textContent = bypass ? "Filter off" : "Filter on";
};
$("nu").oninput = e => { nu = +e.target.value; refresh(); };
$("rho").oninput = e => { rho = +e.target.value; refresh(); };
$("snap").onclick = () => {
  if(!anaIn){ hint("Press Play first, then snap the notch onto the peak."); return; }
  const N = anaIn.frequencyBinCount, d = new Float32Array(N);
  anaIn.getFloatFrequencyData(d);
  const lo = Math.floor(0.01*2*N);
  let best = lo;
  for(let k=lo;k<N;k++) if(d[k]>d[best]) best=k;
  nu = 0.5*best/N;
  $("nu").value = nu; refresh();
};

function refresh(){
  $("nu-v").textContent = nu.toFixed(4);
  $("rho-v").textContent = rho.toFixed(4);
  const fs = ctx ? ctx.sampleRate : 16000;
  $("hz-v").textContent = Math.round(nu*fs);
  $("bw").textContent = ((1-rho)/Math.PI).toFixed(4);
  const tau = Math.round(-1/Math.log(Math.max(rho,1e-6)));
  $("tau").textContent = tau;
  $("taums").textContent = (1000*tau/fs).toFixed(1);
  drawIR(); drawZP();
}

/* ---------- plots ---------- */
function axes(cv, pad){
  const g = cv.getContext("2d");
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,cv.width,cv.height);
  g.lineWidth = 1; g.strokeStyle = "#1c2128";
  g.strokeRect(pad.l+.5, pad.t+.5, cv.width-pad.l-pad.r, cv.height-pad.t-pad.b);
  return g;
}
function Hmag(nuv, nc, r){
  const w = 2*Math.PI*nuv, c = Math.cos(2*Math.PI*nc);
  const nr = 1 - 2*c*Math.cos(w) + Math.cos(2*w), ni = 2*c*Math.sin(w) - Math.sin(2*w);
  const dr = 1 - 2*r*c*Math.cos(w) + r*r*Math.cos(2*w), di = 2*r*c*Math.sin(w) - r*r*Math.sin(2*w);
  return Math.sqrt((nr*nr+ni*ni)/(dr*dr+di*di));
}

const spec = $("spec");
const PAD = {l:44,r:12,t:10,b:24};
function drawSpec(){
  const g = axes(spec, PAD);
  const W = spec.width-PAD.l-PAD.r, H = spec.height-PAD.t-PAD.b;
  const DB0 = -95, DB1 = 5;
  const ydb = db => PAD.t + H*(1-(Math.max(DB0,Math.min(DB1,db))-DB0)/(DB1-DB0));
  // grid
  g.strokeStyle="#e4e2dc"; g.fillStyle="#8a8f98"; g.font="11px ui-monospace,monospace";
  for(let db=0; db>=-90; db-=20){
    const y = ydb(db);
    g.beginPath(); g.moveTo(PAD.l+1,y+.5); g.lineTo(spec.width-PAD.r-1,y+.5); g.stroke();
    g.textAlign="right"; g.fillText(db+" dB", PAD.l-6, y+4);
  }
  for(let v=0.1; v<0.5; v+=0.1){
    const x = PAD.l + W*v/0.5;
    g.beginPath(); g.moveTo(x+.5,PAD.t+1); g.lineTo(x+.5,PAD.t+H-1); g.stroke();
    g.textAlign="center"; g.fillText(v.toFixed(1), x, spec.height-8);
  }
  if(anaIn){
    const N = anaIn.frequencyBinCount;
    const di = new Float32Array(N), dou = new Float32Array(N);
    anaIn.getFloatFrequencyData(di); anaOut.getFloatFrequencyData(dou);
    const trace = (d,col,fill) => {
      g.beginPath();
      for(let k=0;k<N;k++){
        const x = PAD.l + W*(k/N), y = ydb(d[k]+30);
        k? g.lineTo(x,y) : g.moveTo(x,y);
      }
      if(fill){ g.lineTo(PAD.l+W, PAD.t+H); g.lineTo(PAD.l, PAD.t+H); g.closePath(); g.fillStyle=fill; g.fill(); }
      g.strokeStyle=col; g.lineWidth=1; g.stroke();
    };
    trace(di, "#b9bec7", "rgba(185,190,199,.35)");
    trace(dou, "#1f5fbf", "rgba(31,95,191,.18)");
  }
  // |H| in dB
  g.beginPath();
  for(let i=0;i<=W;i++){
    const v = 0.5*i/W, db = 20*Math.log10(Math.max(Hmag(v,nu,rho),1e-6));
    const x = PAD.l+i, y = ydb(db);
    i? g.lineTo(x,y) : g.moveTo(x,y);
  }
  g.strokeStyle = bypass ? "#d8b3ae" : "#c0392b"; g.lineWidth = 1.6; g.stroke();
  requestAnimationFrame(drawSpec);
}

function irCoeffs(){
  const c = Math.cos(2*Math.PI*nu);
  return {b:[1,-2*c,1], a:[1,-2*rho*c,rho*rho]};
}
function drawIR(){
  const cv = $("ir"), pad={l:26,r:8,t:8,b:16};
  const g = axes(cv,pad);
  const W = cv.width-pad.l-pad.r, H = cv.height-pad.t-pad.b;
  const NIR = 120, {b,a} = irCoeffs();
  const h = new Float64Array(NIR); let X1=0,X2=0,Y1=0,Y2=0;
  for(let n=0;n<NIR;n++){
    const x = n===0?1:0;
    const y = b[0]*x + b[1]*X1 + b[2]*X2 - a[1]*Y1 - a[2]*Y2;
    X2=X1;X1=x;Y2=Y1;Y1=y; h[n]=y;
  }
  const y0 = pad.t + H*0.66;                       // h in [-0.5, 1]
  const sc = H/1.5;
  g.strokeStyle="#e4e2dc"; g.beginPath(); g.moveTo(pad.l+1,y0); g.lineTo(cv.width-pad.r-1,y0); g.stroke();
  g.fillStyle="#8a8f98"; g.font="10px ui-monospace,monospace"; g.textAlign="right";
  g.fillText("1", pad.l-4, pad.t+8); g.fillText("0", pad.l-4, y0+3);
  g.strokeStyle="#1f5fbf"; g.lineWidth=1; g.beginPath();
  for(let n=0;n<NIR;n++){
    const x = pad.l + W*n/(NIR-1), y = y0 - h[n]*sc;
    n? g.lineTo(x,y) : g.moveTo(x,y);
  }
  g.stroke();
  g.fillStyle="#8a8f98"; g.textAlign="center"; g.fillText("n = 0 … "+NIR, pad.l+W/2, cv.height-4);
}

function drawZP(){
  const cv = $("zp"), g = cv.getContext("2d");
  g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,cv.width,cv.height);
  g.strokeStyle="#1c2128"; g.lineWidth=1; g.strokeRect(.5,.5,cv.width-1,cv.height-1);
  const cx = cv.width/2, cy = cv.height/2, R = cv.height*0.38;
  g.strokeStyle="#c9c6bf"; g.beginPath(); g.arc(cx,cy,R,0,2*Math.PI); g.stroke();
  g.beginPath(); g.moveTo(cx-R*1.35,cy); g.lineTo(cx+R*1.35,cy);
  g.moveTo(cx,cy-R*1.35); g.lineTo(cx,cy+R*1.35); g.stroke();
  const w = 2*Math.PI*nu;
  // zeros on the unit circle
  g.strokeStyle="#c0392b"; g.lineWidth=1.4;
  [1,-1].forEach(s=>{
    g.beginPath(); g.arc(cx+R*Math.cos(w), cy-s*R*Math.sin(w), 4, 0, 2*Math.PI); g.stroke();
  });
  // poles at radius rho
  g.strokeStyle="#12161c";
  [1,-1].forEach(s=>{
    const px = cx+R*rho*Math.cos(w), py = cy-s*R*rho*Math.sin(w), d=4;
    g.beginPath(); g.moveTo(px-d,py-d); g.lineTo(px+d,py+d); g.moveTo(px-d,py+d); g.lineTo(px+d,py-d); g.stroke();
  });
}

refresh();
drawSpec();
</script>
</body>
</html>
