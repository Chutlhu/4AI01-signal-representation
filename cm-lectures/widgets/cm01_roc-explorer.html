<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Region of convergence explorer</title>
<style>
  :root{
    --ink:#1c1c1a; --ink2:#5f5e5a; --ink3:#8a8983;
    --line:#dedcd4; --surf:#f6f5f1; --page:#ffffff;
    --teal:#1d9e75; --coral:#d85a30; --violet:#6250d6; --blue:#2a78d6;
    --ok-bg:#eaf3de; --ok-fg:#3b6d11; --no-bg:#fceaea; --no-fg:#a32d2d;
    --col1:1fr; --col2:1fr; --col3:3fr;
  }
  html.dark, html[data-theme="dark"]{
    --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8a8983;
    --line:#3a3a37; --surf:#232321; --page:transparent;
    --ok-bg:#27500a; --ok-fg:#c0dd97; --no-bg:#501313; --no-fg:#f7c1c1;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;padding:6px 10px;background:var(--page);color:var(--ink);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;}
  .wrap{max-width:1500px;margin:0 auto;padding-top:8px;}
  .top{display:grid;grid-template-columns:minmax(160px,var(--col1)) minmax(160px,var(--col2)) minmax(0,var(--col3));
       gap:22px;align-items:start;width:100%;}
  .panel-plots{display:flex;flex-direction:column;gap:22px;}
  .panel-plots svg{flex:0 0 auto;}
  #ctrls{display:grid;grid-template-columns:16px 24px minmax(0,1fr) 54px;gap:5px;align-items:center;margin-top:6px;}
  label{font-size:13px;color:var(--ink2);}
  input[type=range]{width:100%;accent-color:var(--teal);}
  input[type=checkbox]{accent-color:var(--teal);}
  input[type=number]{width:60px;font-size:12px;padding:4px 5px;border:1px solid var(--line);
       border-radius:6px;background:transparent;color:var(--ink);font-family:ui-monospace,monospace;}
  .hint{font-size:13px;color:var(--ink2);margin-bottom:6px;}
  .ringbtn{font-size:12px;font-family:ui-monospace,monospace;padding:6px 10px;border-radius:6px;
       text-align:left;cursor:pointer;background:transparent;color:var(--ink);border:1px solid var(--line);}
  .ringbtn.on{border:2px solid var(--teal);background:var(--surf);}
  .badges{display:flex;gap:8px;margin:10px 0;}
  .badge{flex:1;text-align:center;font-size:12px;padding:6px 4px;border-radius:6px;}
  .eqbox{background:var(--surf);border-radius:6px;padding:9px 11px;}
  .eqlab{font-size:11px;color:var(--ink3);}
  .eq{font-size:11px;font-family:ui-monospace,monospace;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
  .plab{font-size:13px;color:var(--ink2);margin:10px 0 1px;}
  #hz{font-size:12px;font-family:ui-monospace,monospace;color:var(--ink2);margin-top:10px;
      text-align:center;white-space:nowrap;overflow:hidden;}
  svg{display:block;color:var(--ink2);width:100%;}
  #note{font-size:13px;color:var(--ink2);margin-top:6px;min-height:18px;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <svg id="zplane" viewBox="0 0 300 300" role="img"
           aria-label="Z-plane with unit circle, active poles, active zero and the shaded region of convergence"></svg>
      <div id="ctrls"></div>
      <div id="hz"></div>
    </div>
    <div>
      <div id="ringlab" class="hint">choice of ring D</div>
      <div id="rings" style="display:flex;flex-direction:column;gap:6px;"></div>
      <div class="badges">
        <div id="badge-c" class="badge">causal</div>
        <div id="badge-s" class="badge">stable</div>
      </div>
      <div class="eqbox">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
          <span class="eqlab">recursion to run</span>
          <span id="passtag" style="font-size:11px;padding:2px 8px;border-radius:6px;background:var(--surf);border:1px solid var(--line);"></span>
        </div>
        <div id="receq" class="eq"></div>
      </div>
    </div>

    <div class="panel-plots">
      <div>
        <div class="plab" style="margin-top:0;">impulse response h(n)</div>
        <svg id="irplot" viewBox="0 0 680 200" role="img" aria-label="Stem plot of the impulse response"></svg>
      </div>
      <div>
        <div class="plab">output y(n) for a unit step input</div>
        <svg id="stepplot" viewBox="0 0 680 200" role="img" aria-label="Stem plot of the step response"></svg>
      </div>
      <div id="note"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var TEAL='#1d9e75', CORAL='#d85a30', VIOLET='#6250d6', BLUE='#2a78d6';
  var ringIdx=2;
  var lastSel=null;
  var q=new URLSearchParams(location.search);
  if(q.get('theme')==='dark') document.documentElement.classList.add('dark');

  if(q.has('cols')){
    var cols=q.get('cols').split(',').map(function(v){return parseFloat(v);});
    if(cols.length===3 && cols.every(function(v){return isFinite(v)&&v>0;})){
      var root=document.documentElement.style;
      root.setProperty('--col1',cols[0]+'fr');
      root.setProperty('--col2',cols[1]+'fr');
      root.setProperty('--col3',cols[2]+'fr');
    }
  }

  var spec=[
    {id:'p1',lab:'d\u2081',val:0.6,on:true},
    {id:'p2',lab:'d\u2082',val:0.8,on:true},
    {id:'z1',lab:'c\u2081',val:0.3,on:true}
  ];
  var qmap={p1:'d1',p2:'d2',z1:'c1'};
  spec.forEach(function(s){
    if(q.has(qmap[s.id])){
      var v=parseFloat(q.get(qmap[s.id]));
      if(isFinite(v)) s.val=Math.max(-2.5,Math.min(2.5,v));
    }
    if(q.get('off') && q.get('off').split(',').indexOf(qmap[s.id])>=0) s.on=false;
  });
  if(q.has('ring')) ringIdx=Math.max(0,parseInt(q.get('ring'),10)||0);

  var cw=document.getElementById('ctrls');
  spec.forEach(function(s){
    var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=s.on; cb.id='e_'+s.id;
    cb.setAttribute('aria-label','enable '+s.lab);
    var lb=document.createElement('label'); lb.textContent=s.lab; lb.htmlFor=s.id;
    var rg=document.createElement('input'); rg.type='range'; rg.id=s.id;
    rg.min=-2.5; rg.max=2.5; rg.step=0.01; rg.value=s.val;
    var nb=document.createElement('input'); nb.type='number'; nb.id=s.id+'n';
    nb.min=-2.5; nb.max=2.5; nb.step=0.01; nb.value=s.val;
    nb.setAttribute('aria-label',s.lab+' value');
    cb.addEventListener('change',function(){resyncRingIdx();draw();});
    rg.addEventListener('input',function(){nb.value=rg.value;resyncRingIdx();draw();});
    nb.addEventListener('input',function(){
      var v=parseFloat(nb.value);
      if(isFinite(v)){rg.value=Math.max(-2.5,Math.min(2.5,v));resyncRingIdx();draw();}
    });
    [cb,lb,rg,nb].forEach(function(e){cw.appendChild(e);});
  });

  function state(){
    var o={};
    spec.forEach(function(s){
      var v=parseFloat(document.getElementById(s.id).value);
      o[s.id]={on:document.getElementById('e_'+s.id).checked, v:(isFinite(v)?v:0)};
    });
    var Pid=[];
    if(o.p1.on) Pid.push({id:'p1', v:o.p1.v});
    if(o.p2.on) Pid.push({id:'p2', v:o.p2.v});
    Pid.sort(function(a,b){return Math.abs(a.v)-Math.abs(b.v);});
    var P=Pid.map(function(p){return p.v;});
    return {P:P, Pid:Pid, c:(o.z1.on?o.z1.v:null)};
  }

  function ringList(Pid){
    var M=[];
    Pid.forEach(function(p){
      var r=Math.abs(p.v);
      if(r<=1e-9) return;
      var grp=null;
      for(var i=0;i<M.length;i++){ if(Math.abs(M[i].r-r)<1e-7){grp=M[i];break;} }
      if(grp) grp.ids.push(p.id); else M.push({r:r, ids:[p.id]});
    });
    M.sort(function(x,y){return x.r-y.r;});
    var out=[];
    for(var r=0;r<=M.length;r++)
      out.push({
        inner:(r>0?M[r-1].r:0), outer:(r<M.length?M[r].r:Infinity),
        innerIds:(r>0?M[r-1].ids:null), outerIds:(r<M.length?M[r].ids:null)
      });
    return out;
  }

  function boundKey(ids,sentinel){
    return ids ? ids.slice().sort().join(',') : sentinel;
  }

  function ringKey(R){
    return boundKey(R.innerIds,'ZERO')+'|'+boundKey(R.outerIds,'INF');
  }

  function resyncRingIdx(){
    var RL=ringList(state().Pid);
    if(!lastSel){ if(ringIdx>=RL.length) ringIdx=RL.length-1; return; }
    var target=-1;
    for(var i=0;i<RL.length;i++){ if(ringKey(RL[i])===lastSel){target=i;break;} }
    ringIdx=(target>=0)?target:(RL.length-1);
  }

  function ringLabel(R){
    if(R.outer===Infinity && R.inner===0) return 'all z \u2260 0';
    if(R.outer===Infinity) return '|z| > '+R.inner.toFixed(2);
    if(R.inner===0) return '|z| < '+R.outer.toFixed(2);
    return R.inner.toFixed(2)+' < |z| < '+R.outer.toFixed(2);
  }

  function sg(v){ return (v<0?'\u2212 ':'+ ')+Math.abs(v).toFixed(2); }
  function f1(v){ return (v<0?'\u2212':'')+Math.abs(v).toFixed(2); }
  function pw(p,n){ if(p===0) return (n===0)?1:0; var v=Math.pow(p,n); return isFinite(v)?v:0; }
  function isCa(p,R){ return Math.abs(p)<=R.inner+1e-7; }

  function transferText(P,c){
    var num=(c===null)?'1':'(1 '+sg(-c)+'z\u207b\u00b9)';
    if(P.length===0) return 'H(z) = '+num;
    var den=P.map(function(p){return '(1 '+sg(-p)+'z\u207b\u00b9)';}).join('');
    return 'H(z) = '+num+' / '+den;
  }

  function impulse(P,c,R){
    var N=70, g=[], n;
    if(P.length===0){
      for(n=-N;n<=N;n++) g.push(n===0?1:0);
    } else if(P.length===1){
      var p=P[0], ca=isCa(p,R);
      for(n=-N;n<=N;n++){
        var v=0;
        if(ca){ if(n>=0) v=pw(p,n); } else { if(n<0) v=-pw(p,n); }
        g.push(isFinite(v)?v:0);
      }
    } else {
      var pa=P[0], pb=P[1], caA=isCa(pa,R), caB=isCa(pb,R);
      var dbl=(Math.abs(pa-pb)<1e-7);
      var A=dbl?0:pa/(pa-pb), B=dbl?0:pb/(pb-pa);
      for(n=-N;n<=N;n++){
        var w=0;
        if(dbl){
          var t=(n+1)*pw(pa,n);
          if(caA){ if(n>=0) w=t; } else { if(n<0) w=-t; }
        } else {
          if(caA){ if(n>=0) w+=A*pw(pa,n); } else { if(n<0) w-=A*pw(pa,n); }
          if(caB){ if(n>=0) w+=B*pw(pb,n); } else { if(n<0) w-=B*pw(pb,n); }
        }
        g.push(isFinite(w)?w:0);
      }
    }
    var h=[];
    for(var i=0;i<g.length;i++) h.push(g[i]-(c===null?0:c)*(i>0?g[i-1]:0));
    return {h:h,N:N};
  }

  function recursion(P,c,R){
    var xz=(c===null)?'':' '+sg(-c)+'\u00b7x(n\u22121)';
    if(P.length===0)
      return {tag:'no recursion', lines:['y(n) = x(n)'+xz,'','FIR: nothing to iterate.']};

    if(P.length===1){
      var p=P[0];
      if(Math.abs(p)<1e-9)
        return {tag:'no recursion', lines:['y(n) = x(n)'+xz,'','Pole at the origin: the factor is 1, still FIR.']};
      if(isCa(p,R))
        return {tag:'forward', lines:['for n increasing:','  y(n) = x(n)'+xz,'       '+sg(p)+'\u00b7y(n\u22121)']};
      var xz2=(c===null)?'':' '+sg(c)+'\u00b7x(n)';
      return {tag:'backward', lines:['for n decreasing:','  y(n) = [ y(n+1) \u2212 x(n+1)'+xz2+' ]','         / '+f1(p)]};
    }

    var pa=P[0], pb=P[1], caA=isCa(pa,R), caB=isCa(pb,R);
    var s1=pa+pb, s2=pa*pb;
    if(caA && caB)
      return {tag:'forward', lines:[
        'for n increasing:',
        '  y(n) = x(n)'+xz,
        '       '+sg(s1)+'\u00b7y(n\u22121) '+sg(-s2)+'\u00b7y(n\u22122)']};
    if(!caA && !caB){
      var xb=(c===null)?'':' '+sg(-c)+'\u00b7x(n+1)';
      return {tag:'backward', lines:[
        'for n decreasing:',
        '  y(n) = [ x(n+2)'+xb,
        '         \u2212 y(n+2) '+sg(s1)+'\u00b7y(n+1) ] / '+f1(s2)]};
    }
    var A=pa/(pa-pb), B=pb/(pb-pa);
    var pc=caA?pa:pb, Ac=caA?A:B, pn=caA?pb:pa, An=caA?B:A;
    return {tag:'mixed', lines:[
      '1  w(n) = x(n)'+xz,
      '2  forward,  pole '+f1(pc)+':',
      '     v\u2081(n) = w(n) '+sg(pc)+'\u00b7v\u2081(n\u22121)',
      '3  backward, pole '+f1(pn)+':',
      '     v\u2082(n) = [ v\u2082(n+1) \u2212 w(n+1) ] / '+f1(pn),
      '4  y(n) = '+f1(Ac)+'\u00b7v\u2081(n) '+sg(An)+'\u00b7v\u2082(n)']};
  }

  function stem(id,f,n0,n1,color){
    var w=680,hh=200,L=42,Rp=8,T=8,Bm=20,m=0;
    for(var n=n0;n<=n1;n++){var v=f(n); if(isFinite(v)&&Math.abs(v)>m)m=Math.abs(v);}
    if(m<1e-9)m=1; if(m>1e7)m=1e7;
    var pwid=w-L-Rp, ph=hh-T-Bm, zero=T+ph/2, ym=m*1.12;
    function X(n){return L+(n-n0)/(n1-n0)*pwid;}
    function Y(v){return zero-(v/ym)*(ph/2);}
    var s='<line x1="'+L+'" y1="'+zero+'" x2="'+(w-Rp)+'" y2="'+zero+'" stroke="currentColor" stroke-width="1" opacity="0.45"/>';
    s+='<line x1="'+X(0).toFixed(1)+'" y1="'+T+'" x2="'+X(0).toFixed(1)+'" y2="'+(hh-Bm)+'" stroke="currentColor" stroke-width="1" opacity="0.25" stroke-dasharray="3 3"/>';
    for(var n=n0;n<=n1;n++){
      var v=f(n); if(!isFinite(v))v=0;
      var vc=Math.max(-m,Math.min(m,v)), x=X(n), y=Y(vc);
      s+='<line x1="'+x.toFixed(1)+'" y1="'+zero+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+color+'" stroke-width="1.6"/>';
      s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.4" fill="'+color+'"/>';
    }
    for(var t=n0;t<=n1;t+=10)
      s+='<text x="'+X(t).toFixed(1)+'" y="'+(hh-5)+'" font-size="11" text-anchor="middle" fill="currentColor">'+t+'</text>';
    var lab=(m>=1e4?m.toExponential(0):m.toFixed(2));
    s+='<text x="4" y="'+(T+9)+'" font-size="11" fill="currentColor">'+lab+'</text>';
    s+='<text x="4" y="'+(hh-Bm)+'" font-size="11" fill="currentColor">-'+lab+'</text>';
    document.getElementById(id).innerHTML=s;
  }

  function fitOneLine(el,maxPx,minPx){
    el.style.whiteSpace='nowrap';
    el.style.fontSize=maxPx+'px';
    var avail=el.clientWidth;
    if(avail<=0) return;
    var full=el.scrollWidth;
    if(full<=avail) return;
    el.style.fontSize=Math.max(minPx,Math.floor(maxPx*avail/full))+'px';
    if(el.scrollWidth>el.clientWidth) el.style.whiteSpace='normal';
  }

  function ann(cx,cy,r1,r2){
    function c(r){return 'M '+(cx-r)+' '+cy+' a '+r+' '+r+' 0 1 0 '+(2*r)+' 0 a '+r+' '+r+' 0 1 0 '+(-2*r)+' 0 ';}
    return c(r2)+c(r1);
  }

  function draw(){
    var st=state(), P=st.P, Pid=st.Pid, c=st.c;
    spec.forEach(function(s){
      var on=document.getElementById('e_'+s.id).checked;
      var rg=document.getElementById(s.id), nb=document.getElementById(s.id+'n');
      rg.disabled=!on; nb.disabled=!on;
      rg.style.opacity=on?'1':'0.35'; nb.style.opacity=on?'1':'0.35';
    });

    var RL=ringList(Pid);
    if(ringIdx>=RL.length) ringIdx=RL.length-1;
    var R=RL[ringIdx];
    lastSel=ringKey(R);
    var causal=(ringIdx===RL.length-1);
    var stable=(R.inner<1 && 1<R.outer);
    var dbl=(P.length===2 && Math.abs(P[0]-P[1])<1e-7);
    var Rmax=P.length?Math.abs(P[P.length-1]):0;

    var S=300,cx=150,cy=150,maxr=Math.max(2.4,Rmax*1.3,(c===null?0:Math.abs(c)*1.3)),k=118/maxr;
    var ri=R.inner*k, ro=(R.outer===Infinity)?null:R.outer*k, g='';
    if(ro===null) g+='<path d="M 0 0 H '+S+' V '+S+' H 0 Z '+ann(cx,cy,ri.toFixed(1),0)+'" fill="'+TEAL+'" opacity="0.16" fill-rule="evenodd"/>';
    else if(R.inner===0) g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+ro.toFixed(1)+'" fill="'+TEAL+'" opacity="0.16"/>';
    else g+='<path d="'+ann(cx,cy,ri.toFixed(1),ro.toFixed(1))+'" fill="'+TEAL+'" opacity="0.16" fill-rule="evenodd"/>';
    if(ri>0.5) g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+ri.toFixed(1)+'" fill="none" stroke="'+TEAL+'" stroke-width="1"/>';
    if(ro!==null) g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+ro.toFixed(1)+'" fill="none" stroke="'+TEAL+'" stroke-width="1"/>';
    g+='<line x1="14" y1="'+cy+'" x2="286" y2="'+cy+'" stroke="currentColor" stroke-width="1" opacity="0.35"/>';
    g+='<line x1="'+cx+'" y1="14" x2="'+cx+'" y2="286" stroke="currentColor" stroke-width="1" opacity="0.35"/>';
    g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+k.toFixed(1)+'" fill="none" stroke="'+VIOLET+'" stroke-width="1.8"/>';
    P.forEach(function(p,i){
      var x=cx+p*k, off=(dbl&&i===1)?3.5:0;
      g+='<line x1="'+(x-5+off)+'" y1="'+(cy-5-off)+'" x2="'+(x+5+off)+'" y2="'+(cy+5-off)+'" stroke="'+CORAL+'" stroke-width="2.2"/>';
      g+='<line x1="'+(x-5+off)+'" y1="'+(cy+5-off)+'" x2="'+(x+5+off)+'" y2="'+(cy-5-off)+'" stroke="'+CORAL+'" stroke-width="2.2"/>';
    });
    if(c!==null) g+='<circle cx="'+(cx+c*k).toFixed(1)+'" cy="'+cy+'" r="5" fill="none" stroke="'+BLUE+'" stroke-width="2.2"/>';
    g+='<text x="'+(cx+k+4)+'" y="'+(cy-6)+'" font-size="11" fill="'+VIOLET+'">|z|=1</text>';
    g+='<text x="10" y="18" font-size="11" fill="'+CORAL+'">\u00d7 poles</text>';
    g+='<text x="10" y="32" font-size="11" fill="'+BLUE+'">\u25cb zero</text>';
    document.getElementById('zplane').innerHTML=g;
    var hzEl=document.getElementById('hz');
    hzEl.textContent=transferText(P,c);
    fitOneLine(hzEl,12,7);

    function badge(id,ok,on,off){
      var e=document.getElementById(id);
      e.style.background=ok?'var(--ok-bg)':'var(--no-bg)';
      e.style.color=ok?'var(--ok-fg)':'var(--no-fg)';
      e.textContent=ok?on:off;
    }
    badge('badge-c',causal,'causal','not causal');
    badge('badge-s',stable,'stable','not stable');

    var rec=recursion(P,c,R);
    document.getElementById('passtag').textContent=rec.tag;
    document.getElementById('receq').textContent=rec.lines.join('\n');

    var IR=impulse(P,c,R), N=IR.N, h=IR.h, acc=0, cum=[];
    for(var i=0;i<h.length;i++){acc+=h[i]; if(!isFinite(acc))acc=0; cum.push(acc);}
    stem('irplot',function(n){return h[n+N];},-20,30,CORAL);
    stem('stepplot',function(n){return cum[n+N];},-20,30,TEAL);

    var note;
    if(P.length===0) note='No poles: pure FIR. D is the whole plane, always stable, order set only by the zero.';
    else if(RL.length===1) note='Every pole sits at the origin: the denominator is 1, so the filter is still FIR.';
    else if(dbl) note='Double pole: h(n) carries the extra factor (n+1). The direct form works, partial fractions do not.';
    else if(P.length===2 && Math.abs(Math.abs(P[0])-Math.abs(P[1]))<1e-7) note='Equal moduli, opposite signs: the middle ring is empty, only two choices of D exist.';
    else if(!stable) note='Unit circle outside D: the recursion shown is numerically unstable, errors grow at every step.';
    else if(rec.tag==='mixed') note='Two passes over the stored signal: offline only, no real-time implementation.';
    else if(c!==null && Math.abs(c)>1) note='Stable, but the zero is outside the unit circle: no causal stable inverse filter.';
    else note='Switch a pole off to see the order drop: fewer poles, fewer rings, fewer implementations.';
    document.getElementById('note').textContent=note;

    var rc=document.getElementById('rings');
    rc.innerHTML='';
    RL.forEach(function(Rj,j){
      var b=document.createElement('button');
      b.className='ringbtn'+(j===ringIdx?' on':'');
      b.textContent=ringLabel(Rj);
      b.addEventListener('click',function(){ringIdx=j;draw();});
      rc.appendChild(b);
    });
    document.getElementById('ringlab').textContent='choice of ring D \u2014 '+RL.length+' possible';
  }

  draw();
  window.addEventListener('resize',draw);
  setTimeout(draw,50);
  setTimeout(draw,300);
})();
</script>
</body>
</html>
